<header><button onclick="dr(1)" aria-label="Меню"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b id="ht">Тренировка</b><span style="width:44px"></span></header><div id="ov" onclick="dr(0)"></div><aside id="dw"><h2 style="padding:6px 8px 12px">Меню</h2><button class="dwi a" data-v="work"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.8h5"/></svg>Тренировка</button><button class="dwi" data-v="day"><svg viewBox="0 0 24 24"><path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20M3.8 6.5l1.2 1.2 2-2.4M3.8 12l1.2 1.2 2-2.4M3.8 17.5l1.2 1.2 2-2.4"/></svg>Сегодня</button><button class="dwi" data-v="tips"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Советы</button><button class="dwi" data-v="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Календарь</button><button class="dwi" data-v="plan"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>План</button><button class="dwi" data-v="set"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ещё</button></aside><div id="md"><div id="mb"></div></div><div id="ts"></div>
<script>
const WD7=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WDM={"Понедельник":"Пн","Вторник":"Вт","Среда":"Ср","Четверг":"Чт","Пятница":"Пт","Суббота":"Сб","Воскресенье":"Вс"};
const num=s=>parseFloat(String(s).replace(",","."));
const fw=w=>String(+w).replace(".",",");
const LT="ОБЛЕГЧЁННАЯ НЕДЕЛЯ: выполни примерно 60–70% обычного числа подходов, не добавляй вес и оставляй 3 повтора в запасе.";
/* ---------- парсер Excel-программы ---------- */
function parseDay(r){const n=r[0],wd=String(r[1]||""),k=String(r[2]||""),t=String(r[3]||""),raw=String(r[4]||"");
 const light=/ОБЛЕГЧ/i.test(raw),text=raw.split(/ОБЛЕГЧ/i)[0].trim(),parts=text.split(/(?:^|\s)\d\)\s/),notes=[],ex=[];
 if(parts[0].trim())notes.push(parts[0].trim());
 const gs=text.match(/начни\s*с\s*([\d,]+)/);
 parts.slice(1).forEach(it=>{const m=it.match(/^([^:]+):\s*(\d+)(?:[–-](\d+))?\s*×\s*(\d+)(?:[–-](\d+))?\s*(сек|мин)?/);
  if(!m){notes.push(it.trim());return}
  let name=m[1].trim();if(/на сторону/.test(it))name+=" (на сторону)";
  const rm=it.match(/отдых\s*([\d,]+)(?:[–-]([\d,]+))?\s*(сек|мин)/);let rest=60,tail=it.slice(m[0].length);
  if(rm){rest=num(rm[2]||rm[1])*(rm[3]==="мин"?60:1);tail=it.slice(it.indexOf(rm[0])+rm[0].length)}
  tail=tail.replace(/^[\s.;)]+/,"").replace(/\.$/,"").trim();if(tail)notes.push(tail);
  const w=/кисте|блин|пояс/i.test(name)&&!/разминк/i.test(name),sm=it.match(/старт\s*\+?([\d,]+)/);
  ex.push({n:name,s:+m[2],lo:+m[4],hi:+(m[5]||m[4]),u:m[6]==="сек"?" сек":"",step:m[6]==="сек"?5:1,rest,w,w0:w?num(sm?sm[1]:gs?gs[1]:"1,25"):0})});
 return{n,wd:WDM[wd]||wd.slice(0,2),k,t,light,note:notes.join(" "),ex}}
const DF={
A:["Подтягивания","Сила — подтягивания с дополнительным весом","Разминка: 2 лёгких подхода подтягиваний. 1) Подтягивания с поясом: 3×4–6, старт +2,5 кг; отдых 3 мин. 2) Подтягивания без веса: 1–2×6–8; отдых 2 мин. 3) Подъём коленей в висе: 3×10–15; отдых 60–90 сек. 4) Планка: 3×40–50 сек; отдых 60 сек. Интенсивность: оставляй 1–2 повтора в запасе. Если +2,5 кг не позволяет выполнить минимум 4 чистых повтора — работай без веса."],
B:["Отжимания","Грудь и трицепс — силовой объём","1) Отжимания с медленным опусканием (3 сек): 4×8–15; отдых 2 мин. 2) Узкие отжимания: 2–3×8–12; отдых 90 сек. 3) Сгибание кистей ладонями вверх с блинами: 2–3×12–20; отдых 60 сек. 4) Разгибание кистей ладонями вниз: 2–3×12–15; отдых 60 сек. 5) Удержание блинов пальцами: 2×20–30 сек; отдых 60 сек. Выбирай вариант отжиманий, при котором остаётся 1–2 повтора в запасе. Для кистей начни с 1,25–2 кг."],
C:["Подтягивания","Подтягивания — объём и техника","1) Подтягивания прямым хватом: 4×6–8; отдых 2–2,5 мин. 2) Подтягивания обратным хватом: 1–2×5–6; отдых 2 мин. 3) Подъём ног или коленей в висе: 3×8–12; отдых 60–90 сек. 4) Боковая планка: 2×30–40 сек на сторону; отдых 45–60 сек. Не выполняй лесенку до максимума. Все повторения — без раскачки, оставляй около 2 повторов в запасе."],
D:["Отжимания","Отжимания — объём и предплечья","1) Классические отжимания: 4×12–18; отдых 90 сек. 2) Узкие отжимания: 2×8–12; отдых 90 сек. 3) Сгибание кистей ладонями вверх: 2×15–20; отдых 60 сек. 4) Разгибание кистей ладонями вниз: 2×12–15; отдых 60 сек. 5) Удержание блинов пальцами: 2×20–30 сек; отдых 60 сек. Не делай дроп-сеты и не доходи до отказа. Для предплечий используй лёгкий контролируемый вес."],
E:["Подтягивания","Подтягивания — умеренная силовая работа","1) Подтягивания прямым или нейтральным хватом: 3×5–7; отдых 2–3 мин. 2) Сведение лопаток в висе: 2×8–10; отдых 60 сек. 3) Обычный вис на турнике: 2×20–30 сек; отдых 60 сек. 4) Скручивания: 3×15–20; отдых 60 сек. Это не день максимума: оставляй 2–3 повтора в запасе. Если хват или локти устали после недели, пропусти вис."],
F:["Отжимания + пресс","Лёгкий день — техника, пресс и восстановление","1) Лёгкие классические отжимания: 3×10–15; отдых 90 сек (оставляй 3 повтора в запасе). 2) Планка: 3×30–45 сек; отдых 60 сек. 3) Обратные скручивания или подъём коленей лёжа: 3×12–15; отдых 60 сек. 4) Мягкая разминка кистей и плеч: 3–5 мин. Должно оставаться ощущение, что мог бы сделать ещё. Не добавляй утяжеление и не выполняй подходы до отказа."],
G:["Отдых","Восстановление","Полный отдых от силовых тренировок. По желанию — спокойная прогулка и лёгкая подвижность без боли. Сон 7–9 часов, обычное полноценное питание и достаточное питьё."]};
const WL=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
function defPlan(){return Array.from({length:30},(_,i)=>{const d=DF["ABCDEFG"[i%7]];return parseDay(["День "+(i+1),WL[i%7],d[0],d[1],d[2]+(i>=21&&i<=26&&i%7<6?" ОБЛЕГЧЁННАЯ НЕДЕЛЯ":"")])})}
const DR="Дополнительный вес: +2,5 кг только если 3×4 чисто с запасом 1–2 повтора. Блины: +1,25 / +2,5 / +3,75 / +5 кг. Сначала добавляй повторения, вес — после выполнения верхней границы во всех подходах. Облегчённая неделя — дни 22–27. Останови упражнение при острой боли.";
/* ---------- состояние ---------- */
const K="wt1";let mem=null,V="work",cur=0;
function iso(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function ymNow(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function init(){return{mo:{}}}
function norm(s){if(!s.tpl)s.tpl=s.plan||defPlan();delete s.plan;
 if(!s.mo){s.mo={};if(s.log&&s.start)Object.keys(s.log).forEach(j=>{const d=new Date(s.start+"T00:00:00");d.setDate(d.getDate()+ +j);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");(s.mo[k]=s.mo[k]||{log:{}}).log[d.getDate()-1]=s.log[j]})}
 delete s.log;delete s.start;s.ac=s.ac||"#2563eb";if(s.pre==null)s.pre=3;s.snd=s.snd||"bell";if(s.vol==null)s.vol=.6;s.ym=ymNow();return s}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(K))}catch(e){}return norm(s||mem||init())}
function gen(ym){const [Y,Mn]=ym.split("-").map(Number),n=new Date(Y,Mn,0).getDate(),T=S.tpl,out=[];

 return h+`<div class="card"><h2>Как работает прогрессия</h2><p class="mu">Цели считаются по тому, что ты реально сделал: введённые повторения и вес на вкладке «Сегодня» учитываются в следующих тренировках.</p></div>`}
async function saveFile(name,blob){try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;if(dl){await dl.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==="declined")return}

 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

 return[d.note,...it,d.light?"ОБЛЕГЧЁННАЯ НЕДЕЛЯ: "+LT.replace("ОБЛЕГЧЁННАЯ НЕДЕЛЯ: ",""):""].filter(Boolean).join("\n")}

 const h2=w2.getRow(1);h2.eachCell(c=>{c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF262626"}};c.font={bold:true,color:{argb:"FFFFFFFF"}}});w2.eachRow((r,n)=>{if(n>1)r.eachCell(c=>{c.alignment={vertical:"top",wrapText:true}})});

 if(r<=0){clearInterval(tI);const was=tm;run=false;if(was==="pre"){beginEx();return}play(S.snd);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  if(was==="ex"){exDone();return}

 save();cur=todayIdx();V="day";render()})}catch(e){toast("Не удалось прочитать программу. Проверьте формат файла.")}};fr.readAsArrayBuffer(f)}
